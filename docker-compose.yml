services:
  postgres:
    image: postgres:16-alpine
    container_name: football-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
      POSTGRES_DB: football_platform
    ports:
      - "5433:5432"
    volumes:
      - football_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  football_postgres_data:
